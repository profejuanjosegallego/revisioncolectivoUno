<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Revisión conjunta del programa · colectivo docente CESDE Medellín">
<title>Revisión Conjunta del Programa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style id="css">
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}

:root{
  --ground:#F1EDF0;
  --surface:#FFFFFF;
  --surface-2:#F8F4F7;
  --ink:#1A1418;
  --ink-soft:#5C525A;
  --ink-faint:#8B7F87;
  --line:#DCD2D8;
  --line-fuerte:#BFB1BA;
  --acento:#B0176B;
  --acento-tenue:#F7E6F0;
  --diverge:#D4227E;
  --diverge-tenue:#FBE7F1;
  --converge:#1E6FB8;
  --converge-tenue:#E4EDF8;
  --ok:#1E6FB8;
  --sombra:0 1px 2px rgba(26,20,24,.06);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#120E11;
    --surface:#1B161A;
    --surface-2:#231C21;
    --ink:#EDE6EB;
    --ink-soft:#A0939B;
    --ink-faint:#776B73;
    --line:#2E262C;
    --line-fuerte:#453A42;
    --acento:#F084BF;
    --acento-tenue:#331023;
    --diverge:#DE4F92;
    --diverge-tenue:#33101F;
    --converge:#4E96E0;
    --converge-tenue:#0E1D2E;
    --ok:#4E96E0;
    --sombra:0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#120E11;
  --surface:#1B161A;
  --surface-2:#231C21;
  --ink:#EDE6EB;
  --ink-soft:#A0939B;
  --ink-faint:#776B73;
  --line:#2E262C;
  --line-fuerte:#453A42;
  --acento:#F084BF;
  --acento-tenue:#331023;
  --diverge:#DE4F92;
  --diverge-tenue:#33101F;
  --converge:#4E96E0;
  --converge-tenue:#0E1D2E;
  --ok:#4E96E0;
  --sombra:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4{
  font-family:var(--sans);
  font-weight:600;letter-spacing:-.015em;line-height:1.2;text-wrap:balance;margin:0;
}
h1{font-size:clamp(1.9rem,4.4vw,2.75rem);font-weight:600}
h2{font-size:clamp(1.4rem,3vw,1.95rem)}
h3{font-size:clamp(1.12rem,2.4vw,1.42rem);letter-spacing:-.012em}
h4{font-size:1.02rem;letter-spacing:-.005em;font-weight:600}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}
a{color:var(--acento);text-underline-offset:.18em;text-decoration-thickness:1px}
strong,b{font-weight:600}

.mono,.eyebrow,.chip,.mini{font-family:var(--mono)}
.eyebrow{font-size:.688rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:.75rem}
.eyebrow .num{color:var(--acento)}
.mini{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:.4rem}

:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:3px}

/* ---------- estructura ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:236px;padding:2.5rem 0 2.5rem 1.75rem;display:none;flex-direction:column;z-index:40;background:linear-gradient(90deg,var(--ground) 70%,transparent)}
.rail::before{content:"";position:absolute;left:2.06rem;top:3.4rem;bottom:3.4rem;width:1px;background:var(--line-fuerte)}
.rail button{position:relative;display:flex;align-items:center;gap:.85rem;background:none;border:0;padding:.5rem 0;cursor:pointer;text-align:left;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;color:var(--ink-faint);flex:1;max-height:5rem}
.rail button .nodo{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line-fuerte);background:var(--ground);flex:none;transition:background .2s,border-color .2s,transform .2s}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="true"]{color:var(--ink);font-weight:700}
.rail button[aria-current="true"] .nodo{background:var(--acento);border-color:var(--acento);transform:scale(1.35)}
.rail button.visto .nodo{background:var(--line-fuerte);border-color:var(--line-fuerte)}
@media (min-width:1180px){.rail{display:flex}}

.barra{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.75rem;padding:.55rem 1.1rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.barra .pista{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.barra .pista i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s ease}
@media (min-width:1180px){.barra{display:none}}

main{max-width:78ch;margin:0 auto;padding:0 1.25rem 8rem}
@media (min-width:1180px){main{margin-left:256px;margin-right:2rem;max-width:76ch}}
@media (min-width:1520px){main{margin-left:auto;margin-right:auto}}

.estacion{padding:4.5rem 0 1rem;scroll-margin-top:4rem}
.estacion + .estacion{border-top:1px solid var(--line)}
.estacion > * + *{margin-top:1.4rem}
.lead{font-size:1.18rem;line-height:1.55;color:var(--ink-soft)}

/* ---------- portada ---------- */
.portada{padding-top:3.5rem;border-top:0}
.portada .marca{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acento);margin-bottom:2.5rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.portada .marca span{color:var(--ink-faint)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:2.2rem}
.cifras div{background:var(--surface);padding:1rem .9rem}
.cifras b{display:block;font-family:var(--sans);font-size:1.65rem;letter-spacing:-.03em;line-height:1}
.cifras span{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-top:.45rem}

/* ---------- bloques ---------- */
.panel{background:var(--surface);border:1px solid var(--line);padding:1.5rem;box-shadow:var(--sombra)}
.panel-2{background:var(--surface-2);border:1px solid var(--line);padding:1.3rem}
.franja{border-left:3px solid var(--acento);padding:.15rem 0 .15rem 1.15rem}
.franja.div{border-color:var(--diverge)}
.franja.con{border-color:var(--converge)}
.cita{font-style:italic;font-size:1.06rem;border-left:2px solid var(--line-fuerte);padding-left:1.1rem;margin:1.3rem 0}
.cita cite{display:block;font-style:normal;font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-top:.6rem}
.fuente{font-family:var(--mono);font-size:.66rem;line-height:1.55;color:var(--ink-faint)}

.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.63rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line-fuerte);color:var(--ink-soft);padding:.22rem .5rem;border-radius:2px;white-space:nowrap}
.chip.ac{border-color:var(--acento);color:var(--acento);background:var(--acento-tenue)}
.chip.dv{border-color:var(--diverge);color:var(--diverge);background:var(--diverge-tenue)}
.chip.cv{border-color:var(--converge);color:var(--converge);background:var(--converge-tenue)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}

ul.limpia{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.55rem}
ul.limpia li{padding-left:1.15rem;position:relative}
ul.limpia li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:1px;background:var(--acento)}

/* ---------- controles ---------- */
.btn{font-family:var(--sans);font-weight:600;font-size:.9rem;background:var(--acento);color:var(--ground);border:1px solid var(--acento);padding:.62rem 1.15rem;border-radius:2px;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.87}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.fantasma{background:transparent;color:var(--ink);border-color:var(--line-fuerte)}
.btn.fantasma:hover{border-color:var(--ink-soft)}
.acciones{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1.2rem}

.opcion{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);padding:.85rem 1rem;cursor:pointer;font-family:var(--sans);font-size:1rem;line-height:1.45;transition:border-color .15s,background .15s}
.opcion:hover{border-color:var(--line-fuerte);background:var(--surface-2)}
.opcion + .opcion{margin-top:.45rem}
.opcion .letra{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--ink-faint);margin-right:.7rem}
.opcion[data-on="1"]{border-color:var(--acento);background:var(--acento-tenue)}
.opcion[data-on="1"] .letra{color:var(--acento)}

.campo{display:flex;flex-direction:column;gap:.35rem;flex:1;min-width:170px}
.campo label{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.campo input[type=text],.campo textarea{background:var(--surface);border:1px solid var(--line-fuerte);padding:.55rem .7rem;border-radius:2px;font-family:var(--sans);font-size:.98rem;width:100%}
.campo textarea{min-height:4.6rem;resize:vertical;line-height:1.5}

/* ---------- escala básico/avanzado ---------- */
.escala-fila{display:grid;grid-template-columns:1fr;gap:.4rem;padding:.95rem 0;border-top:1px solid var(--line)}
.escala-fila:first-child{border-top:0}
.escala-fila .cab{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;justify-content:space-between}
.escala-fila .cab b{font-family:var(--sans);font-size:.98rem}
.escala-fila .que{font-size:.92rem;color:var(--ink-soft);line-height:1.45}
.escala-fila .val{font-family:var(--mono);font-size:.7rem;color:var(--acento);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acento);height:1.5rem;background:transparent;cursor:pointer}
.polos{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- fichas de materia ---------- */
.ficha{border:1px solid var(--line);background:var(--surface);margin-top:.8rem}
.ficha > summary{cursor:pointer;list-style:none;padding:1rem 1.2rem;display:flex;gap:.8rem;align-items:flex-start}
.ficha > summary::-webkit-details-marker{display:none}
.ficha > summary::before{content:"▸";color:var(--acento);font-size:.85rem;line-height:1.6}
.ficha[open] > summary::before{content:"▾"}
.ficha summary b{font-family:var(--sans);font-size:1.02rem;display:block}
.ficha summary .que{font-size:.93rem;color:var(--ink-soft);line-height:1.45;display:block;margin-top:.15rem}
.ficha .interior{padding:0 1.2rem 1.4rem;border-top:1px solid var(--line);margin-top:.2rem;padding-top:1.2rem}
.hoy{background:var(--surface-2);border:1px solid var(--line);padding:.85rem 1rem;font-size:.95rem;line-height:1.5}

/* ---------- gráficas ---------- */
.grafica{overflow-x:auto}
.disp-fila{display:grid;grid-template-columns:1fr;gap:.3rem;padding:.8rem 0;border-top:1px solid var(--line)}
.disp-fila:first-child{border-top:0}
.disp-fila .cab{display:flex;gap:.6rem;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.disp-fila .cab b{font-family:var(--sans);font-size:.95rem}
.disp-fila .tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border:1px solid currentColor;border-radius:2px}
.tag.alta{color:var(--diverge)}
.tag.media{color:var(--acento)}
.tag.baja{color:var(--converge)}
.barras{display:flex;flex-direction:column;gap:.5rem}
.barra-item{display:grid;grid-template-columns:minmax(84px,auto) 1fr auto;gap:.7rem;align-items:center;font-size:.9rem}
.barra-item .pista{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.barra-item .pista i{display:block;height:100%;border-radius:0 3px 3px 0}
.barra-item .n{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.leyenda{display:flex;flex-wrap:wrap;gap:1rem;font-family:var(--mono);font-size:.63rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-top:.9rem}
.leyenda span{display:flex;align-items:center;gap:.4rem}
.leyenda i{width:14px;height:10px;display:block;border-radius:2px}

.tabla-envoltura{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:480px}
th,td{text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.61rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- MNC ---------- */
.escala-mnc{display:flex;flex-direction:column-reverse;border:1px solid var(--line);background:var(--surface)}
.escala-mnc .nvl{display:grid;grid-template-columns:2.6rem 1fr;gap:.9rem;padding:.7rem .9rem;border-top:1px solid var(--line);font-size:.92rem;line-height:1.45}
.escala-mnc .nvl:first-child{border-top:0}
.escala-mnc .nvl b{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);padding-top:.15rem}
.escala-mnc .nvl.aqui{background:var(--acento-tenue)}
.escala-mnc .nvl.aqui b{color:var(--acento);font-weight:700}
.escala-mnc .et{display:inline-block;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acento);border:1px solid var(--acento);padding:.1rem .35rem;margin-left:.5rem}

/* ---------- ramas ---------- */
.ramas{font-family:var(--mono);font-size:.7rem;line-height:1.9;background:var(--surface-2);border:1px solid var(--line);padding:.85rem 1rem;overflow-x:auto;white-space:pre;color:var(--ink-soft);margin-top:.7rem}
.ramas b{color:var(--acento);font-weight:700}
.ramas i{color:var(--converge);font-style:normal}

/* ---------- facilitador ---------- */
details.facilitador{border:1px dashed var(--line-fuerte);margin-top:1.5rem}
details.facilitador > summary{cursor:pointer;list-style:none;padding:.6rem .9rem;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:flex;gap:.5rem;align-items:center}
details.facilitador > summary::-webkit-details-marker{display:none}
details.facilitador > summary::before{content:"▸";font-size:.8rem}
details.facilitador[open] > summary::before{content:"▾"}
details.facilitador .interior{padding:0 .9rem 1rem;font-size:.94rem;color:var(--ink-soft)}
details.facilitador .interior > * + *{margin-top:.7rem}

/* ---------- ES / NO ES ---------- */
.afirmacion{border:1px solid var(--line);background:var(--surface);padding:1rem 1.15rem}
.afirmacion + .afirmacion{margin-top:.6rem}
.par{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.par button{font-family:var(--mono);font-size:.67rem;font-weight:700;letter-spacing:.1em;background:transparent;border:1px solid var(--line-fuerte);color:var(--ink-soft);padding:.38rem .9rem;cursor:pointer;border-radius:2px}
.par button:hover:not(:disabled){border-color:var(--ink-soft);color:var(--ink)}
.par button[aria-pressed="true"]{border-color:var(--acento);color:var(--acento);background:var(--acento-tenue)}
.par button:disabled{cursor:default;opacity:.8}
.veredicto{margin-top:.85rem;padding-top:.85rem;border-top:1px solid var(--line);font-size:.94rem;line-height:1.55;color:var(--ink-soft)}
.veredicto .et{font-family:var(--mono);font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.3rem;color:var(--acento)}

/* ---------- avisos ---------- */
.aviso{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line-fuerte);background:var(--surface-2);padding:.8rem 1rem;font-size:.92rem;line-height:1.5;color:var(--ink-soft)}
.aviso .pt{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none;margin-top:.55em}
.aviso.vivo .pt{background:var(--converge);box-shadow:0 0 0 3px var(--converge-tenue)}
.aviso.solo .pt{background:var(--acento)}

.accion{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);background:var(--surface);padding:.72rem .9rem;cursor:pointer}
.accion + .accion{margin-top:.45rem}
.accion input{margin-top:.35em;accent-color:var(--acento);width:1rem;height:1rem;flex:none}
.accion[data-on="1"]{border-color:var(--acento);background:var(--acento-tenue)}
.accion .t{font-size:.97rem;line-height:1.45}
.accion .cuenta{margin-left:auto;font-family:var(--mono);font-size:.67rem;color:var(--ink-faint);flex:none;padding-left:.6rem}

.pie{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--line);font-size:.9rem;color:var(--ink-soft)}
.pie ol{padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem}
.pie li{font-family:var(--mono);font-size:.67rem;line-height:1.6}

.par-fila{display:grid;grid-template-columns:1fr;gap:.3rem;padding:.7rem 0;border-top:1px solid var(--line)}
.par-fila:first-of-type{border-top:0;padding-top:0}
.par-fila .cab{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.par-fila .cab b{font-size:.94rem;font-weight:600}
.par-fila .cif{font-family:var(--mono);font-size:.65rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.dolor{border:1px solid var(--line);background:var(--surface);padding:1.05rem 1.15rem;box-shadow:var(--sombra)}
.dolor + .dolor{margin-top:.6rem}
.dolor .num{font-family:var(--mono);font-size:.61rem;letter-spacing:.12em;text-transform:uppercase;color:var(--diverge);display:block;margin-bottom:.35rem}
.dolor h4{margin-bottom:.45rem}
.dolor p{font-size:.95rem;color:var(--ink-soft);margin:0;line-height:1.5}
.dolor .dato{font-family:var(--mono);font-size:.68rem;line-height:1.5;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);padding:.4rem .65rem;display:inline-block;margin-top:.75rem}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

/* ---------- instrumento v3 ---------- */
.bloque-materia{border:1px solid var(--line);background:var(--surface);padding:1.15rem 1.2rem;box-shadow:var(--sombra)}
.bloque-materia + .bloque-materia{margin-top:.75rem}
.bloque-materia > .cab{display:flex;gap:.55rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.3rem}
.bloque-materia > .cab b{font-family:var(--sans);font-size:1.04rem;letter-spacing:-.012em;line-height:1.25}
.bloque-materia > .sub{font-size:.9rem;color:var(--ink-soft);line-height:1.5;margin:0}
.bloque-materia .paso{margin-top:1.3rem}
.bloque-materia .paso > .mini{display:block;margin-bottom:.5rem}

.campo label.fila{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem}
.contador{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--ink-faint);flex:none;text-transform:none}
.contador.cerca{color:var(--acento)}
.campo textarea.corta{min-height:4rem}

.fila-grado{display:grid;grid-template-columns:1fr auto;gap:.45rem .9rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.fila-grado:first-of-type{border-top:0;padding-top:0}
.fila-grado .nm{font-size:.94rem;line-height:1.35}
.fila-grado .nm i{display:block;font-style:normal;font-family:var(--mono);font-size:.6rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em;margin-top:.15rem}
.grados{display:flex;gap:.2rem;flex-wrap:wrap}

<section class="estacion portada" id="e0" data-titulo="Punto de partida">
  <p class="marca">Observatorio Curricular · CESDE Medellín <span>/</span> Técnico Laboral como Asistente en Desarrollo de Software</p>

  <h1>Diagnostiquemos juntos</h1>

  <p class="lead" style="margin-top:1.6rem">Tres bloques de preguntas sobre las nueve materias. Nadie se identifica, nadie firma y no hay respuestas correctas. Al final, el tablero muestra en qué estamos de acuerdo y en qué no.</p>

    <p style="display:flex;gap:.7rem;align-items:flex-start"><span class="paso-num">2</span><span><b>Qué haría tu materia con un caso concreto.</b> Un problema de reciclaje y una aplicación para resolverlo.</span></p>
    <p style="display:flex;gap:.7rem;align-items:flex-start;margin-bottom:0"><span class="paso-num">3</span><span><b>Qué cabe hoy de tres prácticas transversales.</b> Control de versiones, auditoría de código con IA, y DevOps y cloud.</span></p>

      <p><b>Regla que conviene decir en voz alta:</b> nadie escribe su nombre, nadie ve la respuesta de otro. Solo se proyecta el resultado del grupo.</p>
      <p><b>Reparto sugerido:</b> cada quien responde primero su materia y luego las otras dos de su nivel. Nueve fichas por persona vuelve las respuestas de relleno, y eso es justo lo que arruina el análisis de términos.</p>

  <h2>Los residuos del barrio</h2>

  <p class="lead">Un problema concreto sobre la mesa. Es el tipo de caso que un proyecto integrador usaría durante todo un nivel, y es el que vas a usar en el bloque 2.</p>

  <div class="panel">
    <p class="fuente" style="margin-bottom:.9rem">CASO DE TRABAJO · MEDELLÍN · COOPERATIVA DE 34 RECICLADORES DE OFICIO · 4 BARRIOS</p>
    <p><b>Una cooperativa de recicladores de oficio</b> del nororiente de Medellín recoge material aprovechable en cuatro barrios. La coordinadora lo dice así: «necesitamos una aplicación para el reciclaje».</p>
    <p>Cuando uno pregunta un poco más, aparece lo que hay detrás:</p>
    <ul class="limpia" style="margin-top:.9rem">
      <li>Cada reciclador anota en una libreta cuántos kilos recogió y de qué material. A fin de mes las cuentas no cuadran y el pago se reparte «como se pueda».</li>
      <li>Los vecinos no saben qué día pasa la ruta ni qué material se recibe, así que buena parte de lo que sacan llega contaminado y se pierde.</li>
      <li>La cooperativa le vende a tres compradores distintos y no sabe cuál paga mejor cada material.</li>
      <li>Para seguir recibiendo apoyo del municipio hay que reportar cuántas toneladas se desviaron del relleno sanitario, y ese dato hoy no existe.</li>
      <li>Cuando entra un reciclador nuevo, nadie sabe con qué criterio se le asigna una ruta.</li>
    </ul>
  </div>
</section>

</section>

  <div id="liderazgo" style="margin-top:1.1rem"></div>
</section>

<!-- ═══════ 04 · BLOQUE 3 ═══════ -->

  <div class="panel franja" style="margin-top:1.5rem">
    <p style="margin-bottom:0">Marca el grado en que <b>cada práctica cabe hoy en cada materia</b>. Es un mapa del estado actual, no de lo que debería ser: lo que se busca es ver si lo vemos igual. Son 27 marcas de un clic.</p>
  </div>

  <div id="matriz" style="margin-top:1.5rem"></div>

  <h3 style="margin-top:2.4rem">Qué alcance le corresponde a cada nivel</h3>

function contador(d){

}

function marcarPendiente(si){

    ? "Tablero <b>conectado</b>. Tienes respuestas sin enviar; se envían solas en unos segundos."

}
function programarEnvio(inmediato){
  if(!TRANSPORTE) return;
  marcarPendiente(true);
  if(temporizador) clearTimeout(temporizador);
  temporizador = setTimeout(publicar, inmediato ? 400 : 5000);
}
/* Transporte A · la API del Observatorio. Guarda un registro anónimo por
   participante y devuelve el conjunto; nunca viaja un nombre. */
function transporteServidor(){
  return {
    vivo:true,
    enviar:function(){
      return fetch(RUTA_API, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sesion:SESION, pid:yo.id, reg:registro()})
      }).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); });
    },
    refrescar:function(){
      return fetch(RUTA_API + "?sesion=" + encodeURIComponent(SESION), {cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(d){
          if(!d || !d.participantes) return false;
          var antes = JSON.stringify(compartido.participantes);
          var mio = compartido.participantes[yo.id];
          compartido.participantes = d.participantes;
          if(mio) compartido.participantes[yo.id] = mio;
          return JSON.stringify(compartido.participantes) !== antes;
        });
    }
  };
}

/* Transporte B · la capability del artifact, que republica la página entera. */
function transporteArtifact(a){
  return {
    vivo:false,
    enviar:function(){
      if(contador(0) > 30) return Promise.resolve();
      contador(1);
      try { sessionStorage.setItem("ct_scroll", String(window.scrollY)); } catch(e){}
      return a.publish(construirDoc(compartido));
    },
    refrescar:function(){ return Promise.resolve(false); }
  };
}

function refrescarVistas(){
  try {
    pintarRequisitos();
    pintarLiderazgo();
    pintarTablero();
    if(analisisPintado) montarAnalisis();
  } catch(e){}
}

function sondear(){
  if(!TRANSPORTE || !TRANSPORTE.vivo || publicando) return;
  TRANSPORTE.refrescar().then(function(cambio){
    if(cambio) refrescarVistas();
  })["catch"](function(){});
}

function publicar(){
  if(!TRANSPORTE || publicando) return;
  if(escribiendo()){ temporizador = setTimeout(publicar, 5000); return; }
  publicando = true;
  compartido.participantes[yo.id] = registro();
  TRANSPORTE.enviar().then(function(){
    publicando = false;
    fallosSeguidos = 0;
    marcarPendiente(false);
  })["catch"](function(err){
    publicando = false;
    var c = err && err.code;
    if(c === "not_writer" || c === "not_granted" || c === "not_declared" ||
       c === "capability_disabled" || c === "capability_removed"){
      TRANSPORTE = null;
      modoSolo("Esta vista es de solo lectura, así que tus respuestas quedan guardadas únicamente en este dispositivo. Para que se sumen al tablero, el enlace debe compartirse con permiso de edición.");
      return;
    }
    fallosSeguidos++;
    if(fallosSeguidos >= 5){
      TRANSPORTE = null;
      modoSolo("Se perdió la conexión con el tablero. Tus respuestas siguen guardadas en este dispositivo y puedes descargar tu acta al final; avísale a quien facilita la sesión.");
      return;
    }
    temporizador = setTimeout(publicar, 8000);
  });
}

function arrancarTransporte(){
  var intento;
  try {
    intento = fetch(RUTA_API + "?sesion=" + encodeURIComponent(SESION), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  } catch(e){
    intento = Promise.reject(e);
  }
  intento.then(function(d){
    if(!d || typeof d !== "object" || !d.participantes) throw new Error("respuesta inesperada");
    compartido.participantes = d.participantes;
    TRANSPORTE = transporteServidor();
    modoVivo();
    refrescarVistas();
    sincronizar();
    setInterval(sondear, 7000);
  })["catch"](function(){
    if(window.claude && window.claude.use){
      window.claude.use("artifact").then(function(a){
        if(a && a.publish){ TRANSPORTE = transporteArtifact(a); modoVivo(); sincronizar(); }
        else modoSolo();
      })["catch"](function(){ modoSolo(); });
    } else {
      modoSolo();
    }
  });
}

function sincronizar(){
  if(!TRANSPORTE || !tengoAlgo()) return;
  var alla = compartido.participantes[yo.id];
  if(!alla || JSON.stringify(alla) !== JSON.stringify(registro())){
    temporizador = setTimeout(publicar, 700 + Math.random() * 3000);
  }
}
function modoVivo(){
  var a = document.getElementById("avisoConexion");
  if(!a) return;
  a.className = "aviso vivo";
  marcarPendiente(false);
}
function modoSolo(msg){
  var a = document.getElementById("avisoConexion");
  if(!a) return;
  a.className = "aviso solo";
  document.getElementById("avisoTexto").innerHTML = msg ||
    "Modo individual: tus respuestas se guardan solo en este dispositivo. Puedes recorrer todo y descargar tu acta al final.";
}

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
function todos(){
  var r = [];
  for(var k in compartido.participantes){ if(k !== yo.id) r.push(compartido.participantes[k]); }
  if(tengoAlgo()) r.push(registro());
  return r;
}
function prom(a){ return a.length ? a.reduce(function(x,y){ return x + y; }, 0) / a.length : 0; }
function desv(a){
  if(a.length < 2) return 0;
  var m = prom(a);
  return Math.sqrt(prom(a.map(function(v){ return (v - m) * (v - m); })));
}
function barra(etq, valor, max, texto, color, hueco){
  var pct = max ? Math.round(valor / max * 100) : 0;
  var estilo = hueco
    ? "background:" + color + "-tenue);border:1px solid " + color + ")"
    : "background:" + color + ")";
  return '<div class="barra-item"><span>' + esc(etq) + '</span>' +
    '<span class="pista"><i style="width:' + Math.max(pct, 2) + '%;' + estilo + '"></i></span>' +
    '<span class="n">' + esc(texto) + "</span></div>";
}
function plural(n, s, p){ return n + " " + (n === 1 ? s : p); }
function materia(slug){
  for(var i = 0; i < MATERIAS.length; i++){ if(MATERIAS[i].slug === slug) return MATERIAS[i]; }
  return null;
}
/* posición 0-100 de una materia, derivada de los peldaños marcados */
function posDe(reg, slug){
  var a = reg && reg.enc && reg.enc[slug];
  if(!a || !a.length) return undefined;
  var s = 0;
  a.forEach(function(i){ s += PELDANOS[i]; });
  return s / a.length;
}

var ENE = String.fromCharCode(241), ENE_MAY = String.fromCharCode(209), MARCA = String.fromCharCode(1);
function normaliza(s){
  var t = String(s || "").split(ENE).join(MARCA).split(ENE_MAY).join(MARCA);
  if(t.normalize) t = t.normalize("NFD");
  t = t.replace(new RegExp("[\\u0300-\\u036f]", "g"), "");
  t = t.split(MARCA).join(ENE).toLowerCase();
  return t.replace(new RegExp("[^a-z0-9 " + ENE + "]", "g"), " ");
}
function terminos(textos){
  var df = {}, tf = {};
  textos.forEach(function(t){
    var vistos = {};
    normaliza(t).split(/\s+/).forEach(function(w){
      if(w.length < 4 || VACIAS.indexOf(w) >= 0) return;
      tf[w] = (tf[w] || 0) + 1;
      if(!vistos[w]){ vistos[w] = 1; df[w] = (df[w] || 0) + 1; }
    });
  });
  return Object.keys(df).map(function(w){ return {w:w, df:df[w], tf:tf[w]}; })
    .sort(function(a,b){ return b.df - a.df || b.tf - a.tf || a.w.localeCompare(b.w); });
}

function montarRail(){
  var secs = Array.prototype.slice.call(app.querySelectorAll(".estacion"));
  var rail = el("rail");
  rail.innerHTML = secs.map(function(s, i){
    return '<button type="button" data-ir="' + s.id + '"><span class="nodo"></span><span>' +
      ("0" + i).slice(-2) + " · " + esc(s.dataset.titulo) + "</span></button>";
  }).join("");
  rail.addEventListener("click", function(e){
    var b = e.target.closest("[data-ir]"); if(!b) return;
    var d = el(b.dataset.ir); if(d) d.scrollIntoView({block:"start"});
  });
  var botones = Array.prototype.slice.call(rail.querySelectorAll("button"));
  var obs = new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting) return;
      var i = secs.indexOf(en.target);
      botones.forEach(function(b, j){
        b.setAttribute("aria-current", j === i ? "true" : "false");
        b.classList.toggle("visto", j < i);
      });
      el("barraEtq").textContent = ("0" + i).slice(-2) + " · " + secs[i].dataset.titulo;
      el("barraNum").textContent = i + "/" + (secs.length - 1);
      el("barraPista").style.width = (i / (secs.length - 1) * 100) + "%";
    });
  }, {rootMargin:"-45% 0px -45% 0px"});
  secs.forEach(function(s){ obs.observe(s); });
}

  if(v === undefined) return "sin marcar";
  if(v <= 20) return "lo esencial · " + Math.round(v);
  if(v <= 40) return "más bien básico · " + Math.round(v);
  if(v <= 60) return "en el medio · " + Math.round(v);
  if(v <= 80) return "más bien exigente · " + Math.round(v);
  return "nivel empresa · " + Math.round(v);
}

      o.dataset.on = activo ? 0 : 1;
      var campo = c.querySelector('[data-campootro="' + s + '"]');
      campo.hidden = activo;
      if(!activo) campo.querySelector("input").focus();
      guardar(); programarEnvio();
      return;
    }
    var b = e.target.closest("[data-enc]"); if(!b) return;
    var slug = b.dataset.enc, i = parseInt(b.dataset.i, 10);
    var arr = yo.enc[slug] || [];
    var p = arr.indexOf(i);
    if(p >= 0) arr.splice(p, 1); else arr.push(i);
    if(arr.length) yo.enc[slug] = arr; else delete yo.enc[slug];
    b.dataset.on = p >= 0 ? 0 : 1;
    c.querySelector('[data-pos="' + slug + '"]').textContent = etiquetaPos(posDe(yo, slug));
    guardar(); programarEnvio();
  });
  c.addEventListener("input", function(e){
    var ot = e.target.closest("[data-otrotxt]");
    if(ot){ yo.otro[ot.dataset.otrotxt] = ot.value; guardar(); return; }
    var t = e.target.closest("[data-obj]"); if(!t) return;
    var slug = t.dataset.obj, v = t.value;
    if(v.trim()) yo.obj[slug] = v.trim(); else delete yo.obj[slug];
    var cc = c.querySelector('[data-cc="' + slug + '"]');
    cc.textContent = v.length + "/" + TOPE;
    cc.classList.toggle("cerca", v.length > TOPE - 25);
    guardar();
  });
  c.addEventListener("change", function(e){
    if(e.target.closest("[data-obj]") || e.target.closest("[data-otrotxt]")) programarEnvio();
  });
}

function pintarLiderazgo(){
  var c = el("liderazgo");
  LIDERAZGO.forEach(function(q){
    var ver = c.querySelector('[data-q="' + q.id + '"] .veredicto');
    if(yo.lider[q.id] === undefined){ ver.hidden = true; return; }
    var lista = todos(), votos = q.ops.map(function(){ return 0; }), n = 0;
    lista.forEach(function(p){
      var v = p.lider && p.lider[q.id];
      if(typeof v === "number"){ votos[v]++; n++; }

    if(n < 2){ ver.hidden = true; return; }
    ver.hidden = false;
    var mx = Math.max.apply(null, votos);
    ver.innerHTML = '<span class="et">El colectivo · ' + plural(n, "respuesta", "respuestas") + "</span>" +
      '<div class="barras" style="margin-top:.6rem">' + q.ops.map(function(o, i){
        return barra("ABCD"[i], votos[i], n, plural(votos[i], "voto", "votos"),
                     "var(--" + (votos[i] === mx && votos[i] > 0 ? "acento" : "line-fuerte"), false);
      }).join("") + "</div>";
  });
}

/* ═══════════ 05 · DIVERGENCIAS ═══════════ */

function pistaSVG(vals, mostrarBanda){
  var W = 320, H = 26, x = function(v){ return 8 + v / 100 * (W - 16); };
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), m = prom(vals);
  var d = desv(vals);
  var color = d > 20 ? "var(--diverge)" : (d > 10 ? "var(--acento)" : "var(--converge)");
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="Dispersión de respuestas">';
  s += '<rect x="8" y="11" width="' + (W - 16) + '" height="4" rx="2" fill="var(--line)"/>';
  if(mostrarBanda && vals.length > 1){
    s += '<rect x="' + x(mn).toFixed(1) + '" y="8" width="' + Math.max(x(mx) - x(mn), 2).toFixed(1) +
         '" height="10" rx="3" fill="' + color + '" fill-opacity="0.2"/>';
  }
  vals.forEach(function(v){
    s += '<circle cx="' + x(v).toFixed(1) + '" cy="13" r="3.4" fill="var(--ink-faint)" stroke="var(--surface)" stroke-width="1.6"><title>' + Math.round(v) + "</title></circle>";
  });
  s += '<rect x="' + (x(m) - 1).toFixed(1) + '" y="4" width="2" height="18" rx="1" fill="' + color + '"><title>promedio ' + Math.round(m) + "</title></rect>";
  s += "</svg>";
  return s;
}

function tonoCelda(v){
  /* tope 55 % para que el numeral en var(--ink) siga legible en tema claro y oscuro */
  return "background:color-mix(in srgb, var(--converge) " + Math.round(v / 3 * 55) + "%, var(--surface-2))";
}

function montarAnalisis(){
  var cont = el("analisis");
  var lista = todos();
  var html = "";
  var hayAlgo = false;

  /* 1 · dispersión por materia */
  var conPos = MATERIAS.map(function(m){
    var vals = lista.map(function(p){ return posDe(p, m.slug); })
                    .filter(function(v){ return typeof v === "number"; });
    return {m:m, vals:vals, d:desv(vals), p:prom(vals)};
  }).filter(function(o){ return o.vals.length > 0; });

  if(conPos.length){
    hayAlgo = true;
    conPos.sort(function(a, b){ return b.d - a.d; });
    html += '<div class="panel"><span class="eyebrow">Gráfica 1 · dispersión por materia</span>' +
      "<h3>¿En qué materias no nos ponemos de acuerdo?</h3>" +
      '<p style="font-size:.95rem;color:var(--ink-soft);margin-top:.5rem">Cada punto es una persona; la posición sale del promedio de los peldaños que marcó. La banda cubre el rango entre la respuesta más baja y la más alta; la línea vertical marca el promedio. Ordenadas de mayor a menor dispersión.</p>' +
      '<div style="margin-top:1.2rem">' +
      conPos.map(function(o){
        var tag = o.d > 20 ? ["alta","muy dividido"] : (o.d > 10 ? ["media","dividido"] : ["baja","consenso"]);
        return '<div class="disp-fila"><div class="cab"><b>' + esc(o.m.nombre) + "</b>" +
          '<span><span class="tag ' + tag[0] + '">' + tag[1] + "</span> " +
          '<span class="n mono" style="font-size:.66rem;color:var(--ink-soft)">prom. ' + Math.round(o.p) +
          " · ±" + o.d.toFixed(1) + " · " + plural(o.vals.length, "resp.", "resps.") + "</span></span></div>" +
          pistaSVG(o.vals, true) +
          '<div class="polos"><span>Lo esencial</span><span>Nivel empresa</span></div></div>';
      }).join("") + "</div>" +
      '<div class="leyenda"><span><i style="background:var(--diverge)"></i>Muy dividido (±20 o más)</span>' +
      '<span><i style="background:var(--acento)"></i>Dividido</span>' +
      '<span><i style="background:var(--converge)"></i>Consenso (±10 o menos)</span></div>' +
      "</div>";

    var top = conPos.slice(0, 3).filter(function(o){ return o.d > 10; });
    if(top.length){
      html += '<div class="panel franja div" style="margin-top:1rem"><h3 style="margin-bottom:.6rem">Lectura</h3><p style="margin-bottom:0">' +
        "Donde más divergimos es en <b>" + top.map(function(o){ return esc(o.m.nombre); }).join("</b>, <b>") +
        "</b>. Esas son las materias que necesitan una decisión de colectivo, no una conversación de pasillo.</p></div>";
    }
  }

  /* 2 · frecuencia de términos */
  var textos = [];
  lista.forEach(function(p){
    if(p.obj) for(var k in p.obj){ if(p.obj[k]) textos.push(p.obj[k]); }
  });
  if(textos.length >= 2){
    hayAlgo = true;
    var ts = terminos(textos);
    var compartidos = ts.filter(function(t){ return t.df > 1; });
    var unicos = ts.filter(function(t){ return t.df === 1; });
    var maxdf = ts.length ? ts[0].df : 1;
    html += '<div class="panel" style="margin-top:1rem"><span class="eyebrow">Gráfica 2 · frecuencia de términos</span>' +
      "<h3>¿Estamos usando las mismas palabras?</h3>" +
      '<p style="font-size:.95rem;color:var(--ink-soft);margin-top:.5rem">Sobre ' + textos.length +
      " frases de objetivo, de máximo " + TOPE + " caracteres cada una. De <b>" + ts.length +
      "</b> términos distintos, <b>" + compartidos.length + "</b> " +
      (compartidos.length === 1 ? "aparece" : "aparecen") + " en más de una frase y <b>" +
      unicos.length + "</b> " + (unicos.length === 1 ? "aparece" : "aparecen") + " una sola vez.</p>" +
      '<div class="barras" style="margin-top:1.2rem">' +
      ts.slice(0, 14).map(function(t){
        return barra(t.w, t.df, maxdf, t.df + (t.df === 1 ? " × 1" : " frases"),
                     "var(--" + (t.df > 1 ? "converge" : "diverge"), t.df === 1);
      }).join("") + "</div>" +
      '<div class="leyenda"><span><i style="background:var(--converge)"></i>Vocabulario compartido</span>' +
      '<span><i style="background:var(--diverge-tenue);border:1px solid var(--diverge)"></i>Aparece una sola vez</span></div>' +
      '<p class="fuente" style="margin-top:.9rem">Se descartan palabras vacías y términos de menos de cuatro letras. Un vocabulario mayoritariamente único no es un problema de redacción: indica que no hay acuerdo sobre para qué existe esa materia.</p></div>';
  }

  /* 2b · temáticas que faltan */
  var faltas = [];
  MATERIAS.forEach(function(m){
    var dichas = [];
    lista.forEach(function(p){
      var v = p.otro && p.otro[m.slug];
      if(v && v.trim()) dichas.push(v.trim());
    });
    if(dichas.length) faltas.push({m:m, ts:dichas});
  });
  if(faltas.length){
    hayAlgo = true;
    html += '<div class="panel" style="margin-top:1rem"><span class="eyebrow">Temáticas que faltan</span>' +
      "<h3>Lo que el colectivo echa de menos</h3>" +
      '<p style="font-size:.95rem;color:var(--ink-soft);margin-top:.5rem">Marcadas en el bloque 1, materia por materia. Van tal como se escribieron.</p>' +
      '<div style="margin-top:1.1rem">' + faltas.map(function(f){
        return '<div class="par-fila"><div class="cab"><b>' + esc(f.m.nombre) + '</b><span class="cif">' +
          plural(f.ts.length, "mención", "menciones") + "</span></div>" +
          f.ts.map(function(t){ return '<p style="font-size:.95rem;margin:.15rem 0 0">· ' + esc(t) + "</p>"; }).join("") + "</div>";
      }).join("") + "</div></div>";
  }

  /* 3 · cómo concebimos el integrador */
  var cuentaTipo = {}, totalCaso = 0;
  ORDEN_TIPOS.forEach(function(k){ cuentaTipo[k] = 0; });
  lista.forEach(function(p){
    if(!p.caso) return;
    for(var s in p.caso){
      var m = materia(s), i = p.caso[s];
      if(m && m.caso[i]){ cuentaTipo[m.caso[i].k]++; totalCaso++; }
    }
  });
  if(totalCaso){
    hayAlgo = true;
    var integra = cuentaTipo.capa + cuentaTipo.insumo;
    var pctInt = Math.round(integra / totalCaso * 100);
    html += '<div class="panel" style="margin-top:1rem"><span class="eyebrow">Gráfica 3 · cómo concebimos el integrador</span>' +
      "<h3>¿Producto común o trabajos en paralelo?</h3>" +
      '<p style="font-size:.95rem;color:var(--ink-soft);margin-top:.5rem">Cada respuesta del bloque 2 se clasifica según el tipo de vínculo que propone con las otras materias. Sobre ' +
      plural(totalCaso, "respuesta", "respuestas") + " del colectivo.</p>" +
      '<div class="barras" style="margin-top:1.2rem">' +
      ORDEN_TIPOS.map(function(k){
        return barra(TIPOS[k].n, cuentaTipo[k], totalCaso,
                     Math.round(cuentaTipo[k] / totalCaso * 100) + " %",
                     "var(--" + (TIPOS[k].c === "integra" ? "converge" : "diverge"), TIPOS[k].c !== "integra");
      }).join("") + "</div>" +
      '<div class="leyenda"><span><i style="background:var(--converge)"></i>Concibe un producto común</span>' +
      '<span><i style="background:var(--diverge-tenue);border:1px solid var(--diverge)"></i>Concibe trabajos sueltos</span></div>' +
      '<p style="font-size:.96rem;margin-top:1rem;margin-bottom:0"><b>' + pctInt +
      " %</b> de las respuestas describe un vínculo real con las otras materias" +
      (pctInt >= 70 ? ": el colectivo concibe el integrador como un producto común."
                    : (pctInt >= 40 ? ", y el resto describe trabajos que solo comparten el tema. Ahí está la conversación pendiente."
                                    : ". La mayoría describe trabajos sueltos con el mismo tema, que es exactamente lo que el diseño llama <i>no integrador</i>.")) +
      "</p>";

    var porMateria = MATERIAS.map(function(m){
      var i = 0, n = 0;
      lista.forEach(function(p){
        var v = p.caso && p.caso[m.slug];
        if(typeof v === "number" && m.caso[v]){ n++; if(TIPOS[m.caso[v].k].c === "integra") i++; }
      });
      return {m:m, i:i, n:n};
    }).filter(function(o){ return o.n > 0; });

    if(porMateria.length){
      html += '<div style="margin-top:1.6rem"><span class="mini">Materia por materia · porcentaje que describe un vínculo real</span>' +
        '<div class="barras">' + porMateria.map(function(o){
          var pct = Math.round(o.i / o.n * 100);
          return barra(o.m.nombre, o.i, o.n, pct + " % de " + o.n,
                       "var(--" + (pct > 50 ? "converge" : "diverge"), pct <= 50);
        }).join("") + "</div></div>";
    }

    var hayLid = LIDERAZGO.some(function(q){
      return lista.some(function(p){ return p.lider && typeof p.lider[q.id] === "number"; });
    });
    if(hayLid){
      html += '<div style="margin-top:1.8rem"><span class="mini">Quién debería liderar cada nivel</span>' +
        LIDERAZGO.map(function(q){
          var votos = q.ops.map(function(){ return 0; }), n = 0;
          lista.forEach(function(p){
            var v = p.lider && p.lider[q.id];
            if(typeof v === "number"){ votos[v]++; n++; }
          });
          if(!n) return "";
          var mx = Math.max.apply(null, votos);
          return '<div style="margin-top:1rem"><span class="fuente">' + esc(q.nivel) + " · " +
            plural(n, "respuesta", "respuestas") + '</span><div class="barras">' +
            q.ops.map(function(o, i){
              return barra(o, votos[i], n, plural(votos[i], "voto", "votos"),
                           "var(--" + (votos[i] === mx && votos[i] > 0 ? "acento" : "line-fuerte"), false);
            }).join("") + "</div></div>";
        }).join("") + "</div>";
    }
    html += "</div>";
  }

  /* 4 · requisitos del integrador */
  var conReq = lista.filter(function(p){ return p.req && p.req.length; });
  if(conReq.length){
    hayAlgo = true;
    html += '<div class="panel" style="margin-top:1rem"><span class="eyebrow">Gráfica 4 · qué hace falta para que sea integrador</span>' +
      "<h3>Dónde hay acuerdo sobre lo imprescindible</h3>" +
      '<p style="font-size:.95rem;color:var(--ink-soft);margin-top:.5rem">Porcentaje de quienes marcaron cada condición. En azul, las que superan la mitad del colectivo. Sobre ' +
      plural(conReq.length, "respuesta", "respuestas") + '.</p><div class="barras" style="margin-top:1.2rem">' +
      REQUISITOS.map(function(r, i){
        var n = conReq.filter(function(p){ return p.req.indexOf(r.id) >= 0; }).length;
        var pct = Math.round(n / conReq.length * 100);
        return barra("ABCDEFGH"[i], n, conReq.length, pct + " %",
                     "var(--" + (pct > 50 ? "converge" : "line-fuerte"), false);
      }).join("") + '</div><p class="fuente" style="margin-top:.7rem">' +
      REQUISITOS.map(function(r, i){ return "ABCDEFGH"[i] + " " + esc(r.t); }).join(" · ") + "</p></div>";
  }

  /* 5 · mapa de calor de las prácticas transversales */
  var celdas = {}, hayMat = false;
  MATERIAS.forEach(function(m){
    celdas[m.slug] = {};
    PRACTICAS.forEach(function(pr){
      var vals = lista.map(function(p){ return p.mat && p.mat[m.slug] && p.mat[m.slug][pr.k]; })
                      .filter(function(v){ return typeof v === "number"; });
      celdas[m.slug][pr.k] = {v:prom(vals), d:desv(vals), n:vals.length};
      if(vals.length) hayMat = true;
    });
  });
  if(hayMat){
    hayAlgo = true;
    html += '<div class="panel" style="margin-top:1rem"><span class="eyebrow">Gráfica 5 · dónde caben hoy las prácticas transversales</span>' +
      "<h3>El mapa de las nueve materias</h3>" +

      '<div class="tabla-envoltura" style="margin-top:1.2rem"><table class="mapa"><thead><tr><th class="mat">Materia</th>' +

            return '<td class="' + (c.d > 0.85 ? "disperso" : "") + '" style="' + tonoCelda(c.v) +
              '" title="' + esc(m.nombre + " · " + pr.n + " · promedio " + c.v.toFixed(1) + " · dispersión " + c.d.toFixed(1) + " · " + c.n + " resp.") +
              '">' + c.v.toFixed(1) + "</td>";
          }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>" +
      '<div class="leyenda"><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>0 · no cabe</span>' +
      '<span><i style="background:var(--converge)"></i>3 · se practica y se evalúa</span>' +
      '<span><i style="background:transparent;border:2px solid var(--diverge)"></i>Aquí no nos ponemos de acuerdo</span></div></div>';
  }

  /* 6 · alcance por nivel */
  var hayNiv = NIVELES.some(function(nv){
    return nv.preguntas.some(function(q){
      return lista.some(function(p){ return p.niv && typeof p.niv[nv.n + "_" + q.k] === "number"; });
    });
  });
  if(hayNiv){
    hayAlgo = true;
    html += '<div class="panel" style="margin-top:1rem"><span class="eyebrow">Gráfica 6 · qué alcance le corresponde a cada nivel</span>' +
      "<h3>Git, IA y cloud, nivel por nivel</h3>" +
      NIVELES.map(function(nv){
        return nv.preguntas.map(function(q){
          var id = nv.n + "_" + q.k;
          var votos = q.ops.map(function(){ return 0; }), n = 0;
          lista.forEach(function(p){
            var v = p.niv && p.niv[id];
            if(typeof v === "number"){ votos[v]++; n++; }
          });
          if(!n) return "";
          var mx = Math.max.apply(null, votos);
          var d = desv(lista.map(function(p){ return p.niv && p.niv[id]; }).filter(function(v){ return typeof v === "number"; }));
          return '<div style="margin-top:1.5rem"><span class="mini">' + esc(nv.t) + " · " + esc(q.q) + "</span>" +
            '<span class="fuente" style="display:block;margin-bottom:.5rem">' + plural(n, "respuesta", "respuestas") +

            q.ops.map(function(o, i){

                           "var(--" + (votos[i] === mx && votos[i] > 0 ? (d > 1 ? "diverge" : "converge") : "line-fuerte"), false);
            }).join("") + '</div><p class="fuente" style="margin-top:.5rem">' +
            q.ops.map(function(o, i){ return "ABCD"[i] + " " + esc(o); }).join(" · ") + "</p></div>";
        }).join("");
      }).join("") + "</div>";
  }

  if(!hayAlgo){
    cont.innerHTML = '<div class="aviso"><span class="pt"></span><span>Todavía no hay respuestas suficientes. Pide al grupo que complete al menos el bloque 1 y vuelve a analizar.</span></div>';
    return;
  }
  cont.innerHTML = html;
  analisisPintado = true;
}

function dumbbell(mnc, emp){
  var W = 320, H = 22, x = function(v){ return 8 + v / 100 * (W - 16); };
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="Marco nacional frente a empleabilidad">';
  s += '<rect x="8" y="10" width="' + (W - 16) + '" height="2" rx="1" fill="var(--line)"/>';
  s += '<line x1="' + x(Math.min(mnc, emp)).toFixed(1) + '" y1="11" x2="' + x(Math.max(mnc, emp)).toFixed(1) +
       '" y2="11" stroke="var(--diverge)" stroke-width="3"/>';
  s += '<circle cx="' + x(emp).toFixed(1) + '" cy="11" r="4.6" fill="var(--diverge)"><title>Empleabilidad ' + emp + "</title></circle>";
  s += '<circle cx="' + x(mnc).toFixed(1) + '" cy="11" r="4.6" fill="var(--converge)"><title>Marco nacional ' + mnc + "</title></circle>";
  s += "</svg>";
  return s;
}

function montarAcciones(){
  var c = el("acciones");
  c.innerHTML = ACCIONES.map(function(k){
    var on = yo.acciones.indexOf(k.id) >= 0;
    return '<label class="accion" data-a="' + k.id + '" data-on="' + (on ? 1 : 0) + '">' +
      '<input type="checkbox" ' + (on ? "checked" : "") + ' data-chk="' + k.id + '">' +
      '<span class="t">' + esc(k.t) + '</span><span class="cuenta" data-cc="' + k.id + '"></span></label>';
  }).join("");
  c.addEventListener("change", function(e){
    var i = e.target.closest("[data-chk]"); if(!i) return;
    var id = i.dataset.chk, p = yo.acciones.indexOf(id);
    if(i.checked && p < 0) yo.acciones.push(id);
    if(!i.checked && p >= 0) yo.acciones.splice(p, 1);
    c.querySelector('[data-a="' + id + '"]').dataset.on = i.checked ? 1 : 0;
    guardar(); programarEnvio();
  });
  el("inLibre").value = yo.libre || "";
  el("btnCerrar").addEventListener("click", function(){
    yo.libre = el("inLibre").value.trim();
    guardar(); programarEnvio(true);
    el("estadoCierre").textContent = "Registrado. Ya está en el acta del colectivo.";
    pintarTablero();
  });
  el("btnExportar").addEventListener("click", exportar);
  pintarTablero();
}

function pintarTablero(){
  var c = el("acciones"), lista = todos();
  ACCIONES.forEach(function(k){
    var n = lista.filter(function(p){ return p.acciones && p.acciones.indexOf(k.id) >= 0; }).length;
    var s = c.querySelector('[data-cc="' + k.id + '"]');
    if(s) s.textContent = n ? n + "×" : "";
  });
  var libres = lista.filter(function(p){ return p.libre && p.libre.trim(); });
  var frases = 0, marcas = 0;
  lista.forEach(function(p){
    if(p.obj) frases += Object.keys(p.obj).length;
    if(p.mat) for(var s in p.mat) marcas += Object.keys(p.mat[s]).length;
  });
  el("tableroFinal").innerHTML = '<div class="panel"><span class="eyebrow">Estado de la sesión</span>' +
    '<div class="cifras" style="margin-top:0">' +
    "<div><b>" + lista.length + "</b><span>participantes</span></div>" +
    "<div><b>" + frases + "</b><span>frases de objetivo</span></div>" +
    "<div><b>" + marcas + "</b><span>marcas en el mapa</span></div>" +
    "<div><b>" + libres.length + "</b><span>observaciones</span></div></div>" +
    (libres.length ? '<div style="margin-top:1.2rem"><span class="mini">Lo que quedó dicho</span>' +
      libres.map(function(p){ return '<p style="font-size:.95rem;margin:0 0 .7rem">' + esc(p.libre) + "</p>"; }).join("") +
      "</div>" : "") + "</div>";
}

  L.push("");

  L.push("BLOQUE 1 · CÓMO VEMOS CADA MATERIA");
  L.push("");
  L.push("1.1 POSICIÓN Y DISPERSIÓN POR MATERIA (0 = lo esencial · 100 = nivel empresa)");

    var v = lista.map(function(p){ return posDe(p, m.slug); }).filter(function(x){ return typeof x === "number"; });

  }).filter(function(o){ return o.v.length; }).sort(function(a, b){ return b.d - a.d; })
    .forEach(function(o){
      L.push("   " + o.m.nombre + ": promedio " + Math.round(o.p) + " · dispersión ±" + o.d.toFixed(1) +
             " · rango " + Math.round(Math.min.apply(null, o.v)) + "-" + Math.round(Math.max.apply(null, o.v)) +
             " · " + o.v.length + " resp.");
    });
  L.push("");
  L.push("1.2 PELDAÑOS MÁS MARCADOS POR MATERIA");
  MATERIAS.forEach(function(m){
    var votos = m.enc.map(function(){ return 0; }), n = 0;
    lista.forEach(function(p){
      var a = p.enc && p.enc[m.slug];
      if(a && a.length){ n++; a.forEach(function(i){ if(votos[i] !== undefined) votos[i]++; }); }
    });
    if(!n) return;
    L.push("   " + m.nombre + " (" + n + " resp.)");

  L.push("1.3 FRASES DE OBJETIVO, POR MATERIA (máximo " + TOPE + " caracteres)");

    if(!rs.length) return;
    L.push("   " + m.nombre);
    rs.forEach(function(t){ L.push("       · " + t); });
  });
  L.push("");
  L.push("1.4 FRECUENCIA DE TÉRMINOS EN LAS FRASES DE OBJETIVO");
  var textos = [];
  lista.forEach(function(p){ if(p.obj) for(var k in p.obj){ if(p.obj[k]) textos.push(p.obj[k]); } });
  var ts = terminos(textos);
  L.push("   Frases analizadas: " + textos.length + " · términos distintos: " + ts.length +
         " · compartidos: " + ts.filter(function(t){ return t.df > 1; }).length);
  ts.slice(0, 20).forEach(function(t){ L.push("       " + t.w + " — en " + t.df + " frase(s), " + t.tf + " menciones"); });
  L.push("");

  L.push("1.5 TEMÁTICAS QUE FALTAN, SEGÚN EL COLECTIVO");
  var hayF = false;
  MATERIAS.forEach(function(m){
    var rs = [];
    lista.forEach(function(p){ if(p.otro && p.otro[m.slug] && p.otro[m.slug].trim()) rs.push(p.otro[m.slug].trim()); });
    if(!rs.length) return;
    hayF = true;
    L.push("   " + m.nombre);
    rs.forEach(function(t){ L.push("       · " + t); });
  });
  if(!hayF) L.push("   (ninguna registrada)");
  L.push("");

  L.push("BLOQUE 2 · EL PROYECTO INTEGRADOR");
  L.push("");
  L.push("2.1 QUÉ HARÍA CADA MATERIA CON EL CASO");
  MATERIAS.forEach(function(m){
    var votos = m.caso.map(function(){ return 0; }), n = 0;
    lista.forEach(function(p){
      var v = p.caso && p.caso[m.slug];
      if(typeof v === "number" && votos[v] !== undefined){ votos[v]++; n++; }
    });
    if(!n) return;
    L.push("   " + m.nombre + " (" + n + " resp.)");
    m.caso.forEach(function(o, i){
      L.push("       [" + Math.round(votos[i] / n * 100) + "%] {" + o.k + "} " + o.t);
    });
  });
  L.push("");
  L.push("2.2 CONCEPCIÓN DEL INTEGRADOR (agregado de todas las respuestas del bloque 2)");
  var ct = {}, tot = 0;
  ORDEN_TIPOS.forEach(function(k){ ct[k] = 0; });
  lista.forEach(function(p){
    if(!p.caso) return;
    for(var s in p.caso){
      var m = materia(s), i = p.caso[s];
      if(m && m.caso[i]){ ct[m.caso[i].k]++; tot++; }
    }
  });
  ORDEN_TIPOS.forEach(function(k){
    L.push("   [" + (tot ? Math.round(ct[k] / tot * 100) : 0) + "%] " + TIPOS[k].n + " (" + TIPOS[k].c + ")");
  });
  L.push("   Vínculo real con otras materias: " + (tot ? Math.round((ct.capa + ct.insumo) / tot * 100) : 0) + "% de " + tot + " respuestas.");
  L.push("");
  L.push("2.3 QUÉ HACE FALTA PARA QUE SEA INTEGRADOR");
  var conReq = lista.filter(function(p){ return p.req && p.req.length; });
  REQUISITOS.forEach(function(r){
    var n = conReq.filter(function(p){ return p.req.indexOf(r.id) >= 0; }).length;
    L.push("   [" + (conReq.length ? Math.round(n / conReq.length * 100) : 0) + "%] " + r.t);
  });
  L.push("");
  L.push("2.4 QUIÉN DEBERÍA LIDERAR CADA NIVEL");
  LIDERAZGO.forEach(function(q){
    L.push("   " + q.nivel);
    q.ops.forEach(function(o, i){
      L.push("       [" + lista.filter(function(p){ return p.lider && p.lider[q.id] === i; }).length + "] " + o);
    });
  });
  L.push("");

  L.push("BLOQUE 3 · PRÁCTICAS TRANSVERSALES");
  L.push("");
  L.push("3.1 MAPA: DÓNDE CABEN HOY (0 no cabe · 1 se menciona · 2 se practica · 3 se practica y se evalúa)");
  L.push("   Materia                                | " + PRACTICAS.map(function(pr){ return (pr.k + "      ").slice(0, 6); }).join(" | "));
  MATERIAS.forEach(function(m){
    var fila = PRACTICAS.map(function(pr){
      var vals = lista.map(function(p){ return p.mat && p.mat[m.slug] && p.mat[m.slug][pr.k]; })
                      .filter(function(v){ return typeof v === "number"; });
      if(!vals.length) return "  ·   ";
      return (" " + prom(vals).toFixed(1) + "±" + desv(vals).toFixed(1)).slice(0, 6);
    }).join(" | ");
    L.push("   " + (m.nombre + "                                        ").slice(0, 38) + " | " + fila);
  });
  L.push("   (valor = promedio del colectivo · ± = dispersión; una dispersión alta significa que no lo vemos igual)");
  L.push("");
  L.push("3.2 QUÉ ALCANCE LE CORRESPONDE A CADA NIVEL");
  NIVELES.forEach(function(nv){
    nv.preguntas.forEach(function(q){
      var id = nv.n + "_" + q.k;
      var vals = lista.map(function(p){ return p.niv && p.niv[id]; }).filter(function(v){ return typeof v === "number"; });
      L.push("   " + nv.t + " · " + q.q + "  (dispersión ±" + desv(vals).toFixed(2) + ")");
      q.ops.forEach(function(o, i){
        L.push("       [" + vals.filter(function(v){ return v === i; }).length + "] " + o);
      });
    });
  });
  L.push("");

  L.push("CIERRE");
  L.push("");
  L.push("4.1 ACCIONES MARCADAS");
  ACCIONES.forEach(function(k){
    L.push("   [" + lista.filter(function(p){ return p.acciones && p.acciones.indexOf(k.id) >= 0; }).length + "] " + k.t);
  });
  L.push("");
  L.push("4.2 OBSERVACIONES, DESACUERDOS Y CONDICIONES");
  var hay = false;
  lista.forEach(function(p){ if(p.libre && p.libre.trim()){ hay = true; L.push("   · " + p.libre); } });
  if(!hay) L.push("   (ninguna registrada)");
  L.push("");
  L.push("ANEXO · EVIDENCIA EXTERNA (datos del Observatorio Curricular, no recogidos en esta sesión)");
  L.push("   Promedio de alineación de las nueve materias, sobre 100:");
  EJES.forEach(function(e){
    L.push("       " + e.n + ": " + Math.round(prom(ALINEACION.map(function(a){ return a[e.k]; }))));
  });
  L.push("   Separación marco nacional / empleabilidad, por materia:");
  ALINEACION.map(function(a){ return {m:materia(a.slug), a:a, g:a.mnc - a.emp}; })
    .sort(function(p, q){ return q.g - p.g; })
    .forEach(function(f){ L.push("       " + f.m.nombre + ": marco " + f.a.mnc + " · empleo " + f.a.emp + " · diferencia " + (f.g >= 0 ? "+" : "") + f.g); });
  L.push("   Brechas señaladas por las empresas: " + BRECHAS_EMP.map(function(b){ return b.t + " (" + b.c + ")"; }).join(" · "));
  L.push("   Foco de demanda del sector: " + FOCO.map(function(f){ return f.t + " " + f.v + "%"; }).join(" · "));
  L.push("");
  L.push("Fuentes: Observatorio Curricular CESDE · Decreto 1649 de 2021 (MNC) · Cenisoft 2025 · CUOC 2025 (DANE) · Testeo empresarial CESDE-Comfama 2026 · Panel de expertos sectoriales CESDE.");
  return L.join("\n");
}

function exportar(){
  var texto = acta();
  var nombre = "acta-revision-conjunta-" + new Date().toISOString().slice(0, 10) + ".txt";
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(function(d){
      if(d && d.save) d.save({filename:nombre, data:texto})["catch"](function(){ mostrarActa(texto); });
      else mostrarActa(texto);
    })["catch"](function(){ mostrarActa(texto); });
  } else mostrarActa(texto);
}

function mostrarActa(texto){
  var t = el("estadoCierre");
  t.innerHTML = "";
  var aviso = document.createElement("p");
  aviso.textContent = "No se pudo descargar el archivo desde aquí. El acta quedó copiada al portapapeles; también puedes seleccionarla abajo:";
  var p = document.createElement("pre");
  p.style.cssText = "white-space:pre-wrap;font-family:var(--mono);font-size:.7rem;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);padding:1rem;max-height:22rem;overflow:auto;margin-top:.8rem";
  p.textContent = texto;
  t.appendChild(aviso); t.appendChild(p);
  try { if(navigator.clipboard) navigator.clipboard.writeText(texto); } catch(e){}
}
